        |\n| cycling | track_cycling | racecycling |\n| cycling | virtual_activity
        | virtual_cycling |\n| dancing |  | dancing |\n| diving |  | diving |\n| diving
        | apnea_diving | diving |\n| diving | apnea_hunting | diving |\n| diving |
        gauge_diving | diving |\n| diving | multi_gas_diving | diving |\n| diving
