        |\n| biathlon |  | biathlon |\n| biking |  | cycling |\n| boating |  | sailing
        |\n| body_transformation |  | body_transformation |\n| bodyweight_training
        |  | bodyweight_training |\n| bouldering |  | bouldering |\n| boxing |  |
