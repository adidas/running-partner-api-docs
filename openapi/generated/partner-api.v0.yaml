---
openapi: 3.0.0
info:
  title: Running App Partner API
  version: '0.1'
  contact:
    name: Running App Partner API Team
    email: partnerapi.digitalsports@adidas.com
  description: |
    Welcome to adidas Running App Partner API documentation!
    The Running App Partner API is a REST API.
    Request and response bodies are, in general, _UTF8 encoded_ and represented in a JSON format.
    It makes use of standard HTTP status codes and verbs.
    All traffic to and from the API must use TLS. This means all API calls must be with the HTTPS scheme.
    The webhook system also only performs requests through HTTPS.
    Also, all endpoints require authentication. See the Authentication section for more information.
tags:
- name: Activities
- name: Webhooks
servers:
- url: https://partnerapi.runtastic.com
  description: Production
paths:
  "/v0/activities":
    get:
      summary: List Activities
      tags:
      - Activities
      operationId: get-v0-list-activities
      description: "List activities from the authenticated user.\n\n<!-- theme: danger
        -->\n> Do not use this endpoint to check for new activities as you have a
        good chance of being rate limited. Our webhooks API allows you to get notified
        whenever a user has created an activity. "
      parameters:
      - "$ref": "#/components/parameters/sort"
      - "$ref": "#/components/parameters/page-number"
      - "$ref": "#/components/parameters/page-size"
      - "$ref": "#/components/parameters/filter-sport-type-name"
      - "$ref": "#/components/parameters/Partner-in-behalf-of-user-Access-Token"
      responses:
        '200':
          description: OK
          content:
            application/vnd.api+json:
              schema:
                "$ref": "#/components/schemas/models_responses_body_activities.index.v0"
              examples:
                Activities list:
                  value:
                    data:
                    - id: 72fa7858-f293-4df0-9cbe-dd5b21e5c6a0
                      type: activity
                      attributes:
                        sport_type: cycling
                        start_time: 1596963316000
                        end_time: 1596987088000
                        start_time_timezone_offset: 7200000
                        end_time_timezone_offset: 7200000
                        distance: 43660
                        duration: 10149133
                        elevation_gain: 322
                        elevation_loss: 319
                        calories: 1526
                        pause_duration: 13623990
                        pulse_avg: 124
                        pulse_max: 151
                        weather_condition: sunny
                        subjective_feeling: awesome
                        surface: road
                        longitude: 14.270083364099264
                        latitude: 48.30641211010516
                        temperature: 28.1
                        notes: Nice bike ride with Kevin
                    links:
                      first: https://partnerapi.runtastic.com/v0/activities?sort=-start_time&page%5Bnumber%5D=1&page%5Bsize%5D=1
                      next: https://partnerapi.runtastic.com/v0/activities?sort=-start_time&page%5Bnumber%5D=4&page%5Bsize%5D=1
                      prev: https://partnerapi.runtastic.com/v0/activities?sort=-start_time&page%5Bnumber%5D=2&page%5Bsize%5D=1
                      last: https://partnerapi.runtastic.com/v0/activities?sort=-start_time&page%5Bnumber%5D=5&page%5Bsize%5D=1
                    meta:
                      overall_count: 5
                    jsonapi:
                      version: '1.0'
          headers: {}
        '400':
          description: Bad Request
          content:
            application/vnd.api+json:
              schema:
                "$ref": "#/components/schemas/schemas_errors_bad-request"
              examples:
                Invalid sport_type_name filter:
                  value:
                    errors:
                    - code: BAD_REQUEST
                      detail: Invalid sport type
                      status: '400'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/schemas_errors_unauthorized"
              examples:
                Invalid access token:
                  value:
                    error_description: The access token is invalid or has expired
                    error: invalid_token
        '403':
          "$ref": "#/components/responses/error-403-forbidden"
        '429':
          description: Too Many Requests
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/schemas_errors_rate-limit"
              examples:
                Rate limit exceeded:
                  value:
                    message: API rate limit exceeded
          headers:
            X-Ratelimit-Limit-Hour:
              "$ref": "#/components/headers/X-Ratelimit-Limit-Hour"
            X-Ratelimit-Limit-Minute:
              "$ref": "#/components/headers/X-Ratelimit-Limit-Minute"
            X-Ratelimit-Remaining-Hour:
              "$ref": "#/components/headers/X-Ratelimit-Remaining-Hour"
            X-Ratelimit-Remaining-Minute:
              "$ref": "#/components/headers/X-Ratelimit-Remaining-Minute"
