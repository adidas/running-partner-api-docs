        | commuting | cycling |\n| cycling | cyclocross | cycling |\n| cycling | downhill
        | mountainbiking |\n| cycling | e_bike_fitness | e_biking |\n| cycling | e_bike_mountain
        | mountainbiking |\n| cycling | gravel_cycling | cycling |\n| cycling | hand_cycling
