                "$ref": "../schemas/errors/rate-limit.yaml"
              examples:
                API rate limit exceeded:
                  value:
                    message: API rate limit exceeded
      description: |-
        A subscription entity has to be related to a user. The request has to be performed in behalf of a user (using the OAuth2 bearer token) and that user will be linked to the subscription.

        Note that a user can have only one Subscription for each WebhookReceiver.
      requestBody:
        content:
          application/json:
            schema:
              "$ref": "../models/requests/body/subscriptions.create.v0.yaml"
            examples:
              Create subscription for `activity:created`:
                value:
                  topics:
                  - activity:created
                  receiver_id: b45de99a-9158-413b-a559-77a398e208f3
      security:
      - Partner-in-behalf-of-User:
        - pa_identity
        - openid
      parameters:
