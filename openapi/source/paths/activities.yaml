      summary: Create Activity
      operationId: post-v0-activities
      responses:
        '204':
          description: No Content
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                "$ref": "../schemas/errors/bad-request.yaml"
              examples:
                Missing file:
                  value:
                    errors:
                    - code: INVALID_MULTIPART_REQUEST
                      detail: 'missing required sidecar resource: file'
                      status: '400'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                "$ref": "../schemas/errors/unauthorized.yaml"
              examples:
                Unauthorized:
                  value:
                    error_description: The access token is invalid or has expired
                    error: invalid_token
        '403':
          description: Forbidden
          content:
            application/vnd.api+json:
              schema:
                type: object
                additionalProperties: false
                properties:
                  errors:
                    type: array
                    items:
                      type: object
                      additionalProperties: false
                      properties:
                        code:
                          type: string
                          enum:
                          - FORBIDDEN
                        status:
                          type: string
                          enum:
                          - '403'
                        title:
                          type: string
                        detail:
                          type: string
                      required:
                      - code
                      - status
                required:
                - errors
              examples:
                Insufficient scope:
                  value:
                    errors:
                    - code: FORBIDDEN
                      detail: 'Insufficient scope. Required: pa_activity_write'
                      status: '403'
