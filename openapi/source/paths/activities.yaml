                Trace Not Found:
                  value:
                    errors:
                    - code: NOT_FOUND
                      status: '404'
        '429':
          description: Too Many Requests
          content:
            application/vnd.api+json:
              schema:
                "$ref": "../schemas/errors/rate-limit.yaml"
              examples:
                Rate limit exceeded:
                  value:
                    message: API rate limit exceeded
          headers:
            X-Ratelimit-Limit-Hour:
              "$ref": "#/components/headers/X-Ratelimit-Limit-Hour"
            X-Ratelimit-Limit-Minute:
              "$ref": "#/components/headers/X-Ratelimit-Limit-Minute"
            X-Ratelimit-Remaining-Hour:
              "$ref": "#/components/headers/X-Ratelimit-Remaining-Hour"
            X-Ratelimit-Remaining-Minute:
              "$ref": "#/components/headers/X-Ratelimit-Remaining-Minute"
      security:
      - Partner-in-behalf-of-User:
        - pa_identity
        - pa_activity_read
      operationId: get-v0-retrieve-activity-trace
      parameters:
      - "$ref": "#/components/parameters/Partner-in-behalf-of-user-Access-Token"
      description: "\nRetrieve GPS trace of an activity in GPX format.\n\n## GPX Schema
        for Activty Exports\n\nGPX is a widely used XML format for geospatial data.
        \n\n**adidas Running App** uses the following schema definitions:\n- GPX schema
        v1.1 [(by Topografix)][gpx-xsd]\n- Track Point Extension v1 [(by Garmin)][garmin-track-point-extension-v1]\n\nThe
        following sections describe how **adidas Running App** exports a sport activity
        trace in GPX format.\n\n### Sport Activity Data\n\n#### GPS Points\n\n- Schema:
        [GPX v1.1][gpx-xsd] \n\nThe GPX will contain track segment tag (`<trkseg>`)
        inside the track tag (`<trk>`), which will contain all GPS points as track
        points (`<trkpt>`).\n\n##### GPS Point Structure\n\n**adidas Running App** utilizes
        the following attributes of a `<trkpt>`, as well as additional nested tags,
        to export a GPS point:\n\n| GPS point attribute \t| Unit                    \t|
        XML Reference                     \t|\n|:---------:\t|-------------------------\t|-----------------------------------\t|\n|
        Latitude  \t| Decimal degrees ([WSG84][wsg-84]) \t| `lat` attribute of `<trkpt>`|\n|
        Longitude \t| Decimal degrees ([WSG84](wsg-84)) \t| `lon` attribute of `<trkpt>`|\n|
        Elevation \t| Meters                  \t| `<ele>` tag value nested inside
        `<trkpt>`|\n| Time      \t| ISO8601 timestamp       \t| `<time>` tag value
        nested inside `<trkpt>`|\n\n<details>\n  <summary>Example</summary>\n\n<!--\ntitle:
        Two GPS points\nlineNumbers: true\n-->\n```xml\n<trk>\n  <trkseg>\n    <trkpt
        lat=\"47.6409219391644001007080078125\" lon=\"13.61675835214555263519287109375\">\n
        \     <ele>502</ele>\n      <time>2015-07-11T03:00:51.000Z</time>\n    </trkpt>\n
        \   <trkpt lat=\"47.6409219391644001007080078125\" lon=\"13.61675835214555263519287109375\">\n
        \     <ele>502</ele>\n      <time>2015-07-11T03:00:52.000Z</time>\n    </trkpt>\n
        \   ...\n  <trkseg>\n</trk>\n```\n</details>  \n\n#### Heart Rate\n\n- Schema:
        [Track Point Extension v1][garmin-track-point-extension-v1]\n- Namespace:
        `gpxtpx`\n- Unit: Beats per minute `[bpm]`\n\nHeart rate information is included
        in the `<gpxtpx:hr>` tag and is stored alongside the corresponding GPS point.
        \n\n<details>\n  <summary>Example</summary>\n\n<!--\ntitle: Example of a heart
        rate value (line 7)\nlineNumbers: true\n-->\n```xml\n<gpx xmlns:gpxtpx=\"http://www.garmin.com/xmlschemas/TrackPointExtension/v1\"
        ... > \n  <trk>\n    <trkseg>\n      <trkpt lat=\"47.6409219391644001007080078125\"
        lon=\"13.61675835214555263519287109375\">\n        ...\n        <extensions>\n
        \         <gpxtpx:TrackPointExtension>\n            <gpxtpx:hr>103</gpxtpx:hr>\n
        \         </gpxtpx:TrackPointExtension>\n        </extensions>\n      </trkpt>\n
        \     ...\n    <trkseg>\n  </trk>\n</gpx>\n```\n</details> \n\n### Metadata\n\n-
        Schema: [GPX v1.1][gpx-xsd]\n\nThe metadata section includes name, link and
        time information inside the metadata tag (`<metadata>`).\n\nThe time tag (`<time>`)
        contains the start time of the activity.\n\nThe name tag (`<name>`) shows
        the name of the activity which starts with \"runtastic\\_\" and is followed
        by the activity's start date and time, e.g `runtastic_20220629_0928`. \n\n###
        Complete GPX export example\n\n<!--\ntitle: Example of a running activity
        with heart rate measurements for export\nlineNumbers: true\n-->\n```xml\n<?xml
        version=\"1.0\" encoding=\"UTF-8\"?>\n<gpx creator=\"Runtastic: Life is short
        - live long, http://www.runtastic.com\" version=\"1.1\" xmlns=\"http://www.topografix.com/GPX/1/1\"
        xmlns:gpxtpx=\"http://www.garmin.com/xmlschemas/TrackPointExtension/v1\" xmlns:gpxx=\"http://www.garmin.com/xmlschemas/GpxExtensions/v3\"
        xmlns:xsi=\"http://www.w3.org/2001/XMLSchema-instance\" xsi:schemaLocation=\"http://www.topografix.com/GPX/1/1
        http://www.topografix.com/GPX/1/1/gpx.xsd http://www.garmin.com/xmlschemas/GpxExtensions/v3
        http://www.garmin.com/xmlschemas/GpxExtensionsv3.xsd http://www.garmin.com/xmlschemas/TrackPointExtension/v1
        http://www.garmin.com/xmlschemas/TrackPointExtensionv1.xsd\">\n  <metadata>\n
        \   <name>runtastic_20220629_0928</name>\n    <link href=\"http://www.runtastic.com\">\n
        \     <text>runtastic</text>\n    </link>\n    <time>2022-06-29T09:28:32.000Z</time>\n
        \ </metadata>\n  <trk>\n    <name>runtastic_20220629_0928</name>\n    <link
        href=\"http://www.runtastic.com/sport-sessions/790cd15c-cb66-44de-8fb4-d883cfd7ffef\">\n
        \     <text>Visit this link to view this activity on runtastic.com</text>\n
        \   </link>\n    <trkseg>\n      <trkpt lat=\"50.469200134277344\" lon=\"6.095468521118164\">\n
        \       <ele>492.0</ele>\n        <time>2022-06-29T09:28:32.000Z</time>\n
        \       <extensions>\n          <gpxtpx:TrackPointExtension>\n            <gpxtpx:hr>128</gpxtpx:hr>\n
        \         </gpxtpx:TrackPointExtension>\n        </extensions>\n      </trkpt>\n
        \     <trkpt lat=\"50.4691047668457\" lon=\"6.095335483551025\">\n        <ele>492.0</ele>\n
        \       <time>2022-06-29T09:28:35.000Z</time>\n        <extensions>\n          <gpxtpx:TrackPointExtension>\n
        \           <gpxtpx:hr>130</gpxtpx:hr>\n          </gpxtpx:TrackPointExtension>\n
        \       </extensions>\n      </trkpt>\n      ...\n    </trkseg>\n  </trk>\n</gpx>\n```\n\n[gpx-xsd]:
        https://www.topografix.com/GPX/1/1/gpx.xsd\n[garmin-track-point-extension-v1]:
        https://www8.garmin.com/xmlschemas/TrackPointExtensionv1.xsd\n[wsg-84]: https://en.wikipedia.org/wiki/World_Geodetic_System\n"
