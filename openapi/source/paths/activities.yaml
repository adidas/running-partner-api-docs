        suspension_training |  | suspension_training |\n| swimming |  | swimming |\n|
        swimming | lap_swimming | swimming |\n| swimming | open_water | swimming |\n|
        tactical |  | other |\n| tennis |  | tennis |\n| tennis | exercise | tennis
        |\n| tennis | match | tennis |\n| tennis | warm_up | tennis |\n| tabata |
        \ | tabata |\n| table_tennis |  | table_tennis |\n| track_field |  | track_field
        |\n| trail_running |  | trail_running |\n| training |  | strength_training
        |\n| training | cardio_training | aerobics |\n| training | flexibility_training
        | other |\n| training | strength_training | strength_training |\n| training
        | yoga | yoga |\n| trampoline |  | trampoline |\n| transition |  | other |\n|
        transition | bike_to_run_transition | other |\n| transition | run_to_bike_transition
        | other |\n| transition | swim_to_bike_transition | other |\n| treadmill |
        \ | treadmill |\n| via_ferrata |  | via_ferrata |\n| virtual_cycling |  |
        virtual_cycling |\n| virtual_running |  | virtual_running |\n| volleyball
        |  | volleyball |\n| wakeboarding |  | wakeboarding |\n| walking |  | strolling
        |\n| walking | casual_walking | strolling |\n| walking | indoor_walking |
        strolling |\n| walking | speed_walking | strolling |\n| water_skiing |  |
        other |\n| wheelchair |  | wheelchair |\n| windsurfing |  | windsurfing |\n|
        yoga |  | yoga |\n| zumba |  | zumba |\n\n<!--\ntype: tab\ntitle: GPX format
        info\n-->\n\n## GPX Schema for Activity Imports\n\nGPX is a widely used XML
        format for geospatial data. \n\n**adidas Runtastic Partner API** supports
        the following schema definitions:\n- GPX schema v1.1 [(by Topografix)][gpx-xsd]\n-
        Track Point Extension v1 [(by Garmin)][garmin-track-point-extension-v1]\n\nThe
        following sections describe how **adidas Runtastic** creates a sport activity
        based on your GPX file.\n\n<!-- theme: warning -->\n> Not supported extensions
        or custom XML tags will be ignored during the GPX import.\n\n### Sport Activity
        Data\n\n#### GPS Points\n\n- Schema: [GPX v1.1][gpx-xsd] \n\n<details>\n  <summary>Example</summary>\n\n<!--\ntitle:
        Two GPS points\nlineNumbers: true\n-->\n```xml\n<trk>\n  <trkseg>\n    <trkpt
        lat=\"47.6409219391644001007080078125\" lon=\"13.61675835214555263519287109375\">\n
        \     <ele>502</ele>\n      <time>2015-07-11T03:00:51.000Z</time>\n    </trkpt>\n
        \   <trkpt lat=\"47.6409219391644001007080078125\" lon=\"13.61675835214555263519287109375\">\n
        \     <ele>502</ele>\n      <time>2015-07-11T03:00:52.000Z</time>\n    </trkpt>\n
        \   ...\n  <trkseg>\n</trk>\n```\n</details>  \n\nPoint tags (`<trkpt>`) inside
        a track segment tag (`<trkseg>`) will be parsed as GPS points. The `<trkseg>`
        needs to be inside of a track tag (`<trk>`) as defined in the specification.\n\n#####
        GPS Point Structure\n\n**adidas Runtastic** utilizes the following attributes
        of a `<trkpt>`, as well as additional nested tags, to build a GPS point:\n\n|
        GPS point attribute \t| Unit                    \t| XML Reference                     \t|\n|:---------:\t|-------------------------\t|-----------------------------------\t|\n|
        Latitude  \t| Decimal degrees ([WSG84][wsg-84]) \t| `lat` attribute of `<trkpt>`|\n|
        Longitude \t| Decimal degrees ([WSG84](wsg-84)) \t| `lon` attribute of `<trkpt>`|\n|
        Elevation \t| Meters                  \t| `<ele>` tag value nested inside
        `<trkpt>`|\n| Time      \t| ISO8601 timestamp       \t| `<time>` tag value
        nested inside `<trkpt>`|\n\n##### Derived Sport Activity Metrics\n\nBased
        on the attributes listed above, metrics like *distance*, *duration*, *speed*,
        *elevation gain / loss* and *maximum speed* are calculated.\n\n#### Sport
        Type\n\n- Schema: [GPX v1.1][gpx-xsd]\n\n<details>\n  <summary>Example</summary>\n\n<!--\ntitle:
        Example of a running sport activity\nlineNumbers: true\n-->\n```xml\n<trk>\n
        \ <type>running</type>\n  ...\n</trk>\n```\n</details> \n\nThe name of the
        sport type is extracted from the `<type>` tag, which is nested inside a track
        tag (`<trk>`).\n\nYou can find a list of supported sport types down below.\n\n<details>\n
        \ <summary>List of supported sport types</summary>\n\n  - aerobics\n - alpine_skiing\n
        - american_football\n - badminton\n - baseball\n - basketball\n - beach_volleyball\n
        - biathlon\n - biking\n - boating\n - body_transformation\n - bodyweight_training\n
        - bouldering\n - boxing\n - butt_training\n - calisthenics\n - cheerleading\n
        - cricket\n - cross_country_skiing\n - cross_skating\n - crossfit\n - curling\n
        - cycling\n - dancing\n - diving\n - driving\n - e_biking\n - e_sports\n -
        fencing\n - field_hockey\n - fishing\n - fitness_equipment\n - floor_climbing\n
        - flying\n - freecrossen\n - frisbee\n - generic\n - golf\n - gymnastics\n
        - handball\n - hang_gliding\n - hiking\n - horseback_riding\n - hunting\n
        - ice_hockey\n - ice_skating\n - ice_stock\n - inline_skating\n - jumping_rope\n
        - jumpmaster\n - kayaking\n - kite_skiing\n - kitesurfing\n - lacrosse\n -
        leg_training\n - martial_arts\n - meditation\n - motorcycling\n - mountaineering\n
        - multisport\n - nordicwalking\n - olympic_weightlifting\n - paddling\n -
        padel\n - plogging\n - pole_dancing\n - powerlifting\n - pullups\n - pushups\n
        - rafting\n - rock_climbing\n - rowing\n - rugby\n - running\n - sailing\n
        - scootering\n - situps\n - sixpack\n - skateboarding\n - skike\n - sky_diving\n
        - snowboarding\n - snowmobiling\n - snowshoeing\n - sledding\n - smovey_exercising\n
        - smovey_walking\n - snowball_fight\n - snowman_building\n - soccer\n - speed_skiing\n
        - squash\n - squats\n - stand_up_paddleboarding\n - stretching\n - surfing\n
        - suspension_training\n - swimming\n - tactical\n - tennis\n - tabata\n -
        table_tennis\n - track_field\n - training\n - trampoline\n - transition\n
        - via_ferrata\n - volleyball\n - wakeboarding\n - walking\n - water_skiing\n
        - wheelchair\n - windsurfing\n - zumba\n</details>\n\n#### Heart Rate\n\n-
        Schema: [Track Point Extension v1][garmin-track-point-extension-v1]\n- Unit:
        Beats per minute `[bpm]`\n\n<details>\n  <summary>Example</summary>\n\n<!--\ntitle:
        Example of a heart rate value (line 7)\nlineNumbers: true\n-->\n```xml\n<gpx
        xmlns:ns3=\"http://www.garmin.com/xmlschemas/TrackPointExtension/v1\" ...
        > \n  <trk>\n    <trkseg>\n      <trkpt lat=\"47.6409219391644001007080078125\"
        lon=\"13.61675835214555263519287109375\">\n        ...\n        <extensions>\n
        \         <ns3:TrackPointExtension>\n            <ns3:hr>103</ns3:hr>\n          </ns3:TrackPointExtension>\n
        \       </extensions>\n      </trkpt>\n      ...\n    <trkseg>\n  </trk>\n</gpx>\n```\n</details>
        \n\nHeart rate information is extracted from the `<hr>` tag and is stored
        along side the corresponding GPS point. \n\n#### Temperature\n\n- Schema:
        [Track Point Extension v1][garmin-track-point-extension-v1]\n- Unit: Centigrade
        `[°C]`\n\n<details>\n  <summary>Example</summary>\n\n<!--\ntitle: Example
        of a air temperature value (line 7)\nlineNumbers: true\n-->\n```xml\n<gpx
        xmlns:ns3=\"http://www.garmin.com/xmlschemas/TrackPointExtension/v1\" ...
        > \n  <trk>\n    <trkseg>\n      <trkpt lat=\"47.6409219391644001007080078125\"
        lon=\"13.61675835214555263519287109375\">\n        ...\n        <extensions>\n
        \         <ns3:TrackPointExtension>\n            <ns3:atemp>8.0</ns3:atemp>\n
        \         </ns3:TrackPointExtension>\n        </extensions>\n      </trkpt>\n
        \     ...\n    <trkseg>\n  </trk>\n</gpx>\n```\n</details> \n\n**adidas Runtastic**
        pulls air temperature data from the `<atemp>` tag and calculates the [median](https://en.wikipedia.org/wiki/Median)
        of the entire sport activity.\n\n### Complete GPX import example\n\n<!--\ntitle:
        Example of a running activity with air temperature and heart rate measurements
        for import\nlineNumbers: true\n-->\n```xml\n<?xml version=\"1.0\" encoding=\"UTF-8\"?>\n<gpx
        xsi:schemaLocation=\"http://www.topografix.com/GPX/1/1 http://www.topografix.com/GPX/11.xsd\"\n
        \ xmlns=\"http://www.topografix.com/GPX/1/1\"\n  xmlns:ns3=\"http://www.garmin.com/xmlschemas/TrackPointExtension/v1\"\n
        \ xmlns:ns2=\"http://www.garmin.com/xmlschemas/GpxExtensions/v3\" xmlns:xsi=\"http://www.w3.org/2001/XMLSchema-instance\">\n
        \ <trk>\n    <name>A Running Activity</name>\n    <type>running</type>\n    <trkseg>\n
        \     <trkpt lat=\"47.63674112968146800994873046875\" lon=\"13.6338529922068119049072265625\">\n
        \       <ele>568.20001220703125</ele>\n        <time>2015-07-11T03:08:14.000Z</time>\n
        \       <extensions>\n          <ns3:TrackPointExtension>\n            <ns3:atemp>8.0</ns3:atemp>\n
        \           <ns3:hr>160</ns3:hr>\n          </ns3:TrackPointExtension>\n        </extensions>\n
        \     </trkpt>\n      <trkpt lat=\"47.63678236864507198333740234375\" lon=\"13.63387294113636016845703125\">\n
        \       <ele>568.79998779296875</ele>\n        <time>2015-07-11T03:08:16.000Z</time>\n
        \       <extensions>\n          <ns3:TrackPointExtension>\n            <ns3:atemp>8.0</ns3:atemp>\n
        \           <ns3:hr>159</ns3:hr>\n          </ns3:TrackPointExtension>\n        </extensions>\n
        \     </trkpt>\n      <trkpt lat=\"47.6368047483265399932861328125\" lon=\"13.63388140685856342315673828125\">\n
        \       <ele>569.20001220703125</ele>\n        <time>2015-07-11T03:08:17.000Z</time>\n
        \       <extensions>\n          <ns3:TrackPointExtension>\n            <ns3:atemp>8.0</ns3:atemp>\n
        \           <ns3:hr>160</ns3:hr>\n          </ns3:TrackPointExtension>\n        </extensions>\n
        \     </trkpt>     \n    </trkseg>\n  </trk>\n</gpx>\n\n```\n\n[gpx-xsd]:
        https://www.topografix.com/GPX/1/1/gpx.xsd\n[garmin-track-point-extension-v1]:
        https://www8.garmin.com/xmlschemas/TrackPointExtensionv1.xsd\n[wsg-84]: https://en.wikipedia.org/wiki/World_Geodetic_System\n<!--\ntype:
        tab\ntitle: TCX format info\n-->\n\n## TCX Format\n\nTCX is another XML based
        format to exchange trace data. \n**adidas Runtastic Partner API** supports
        the following attributes (supported attributes are listed in []):\n* Activities\n
        \ * Activity[Sport]\n  * Id (= Start time of activity)\n  * Lap\n    * TotalTimeSeconds\n
        \   * DistanceMeters\n    * MaximumSpeed\n    * Calories\n    * Track\n      *
        Trackpoint\n        * Time\n        * Position\n          * LatitudeDegrees\n
        \         * LongitudeDegrees\n        * AltitudeMeters\n        * DistanceMeters\n
        \       * HeartRateBpm\n          * Value\n\n<!-- theme: info -->\n> All laps
        and tracks inside one activity are combined on our side. If there are multiple
        activities in one tcx file, we import them as separate activities.\n\nCompared
        to a GPX file, a TCX file can also be created without having GPS coordinates
        available,\nso it can be used to export indoor sports data including a heart-rate
        trace for example.\n\n<!-- theme: warning -->\n> Not supported extensions
        or custom XML tags will be ignored during the TCX import.\n\n<details>\n  <summary>Example</summary>\n\n<!--\ntitle:
        Two points\nlineNumbers: true\n-->\n```xml\n  <Activities>\n    <Activity
        Sport=\"biking\">\n      <Id>2010-06-26T10:06:11Z</Id>\n      <Lap StartTime=\"2010-06-26T10:06:11Z\">\n
        \       <TotalTimeSeconds>1.0</TotalTimeSeconds>\n        <DistanceMeters>9762.4433594</DistanceMeters>\n
        \       <MaximumSpeed>15.2404995</MaximumSpeed>\n        <Calories>493</Calories>\n
        \       <Track>\n          <Trackpoint>\n            <Time>2010-06-26T10:06:11Z</Time>\n
        \           <Position>\n              <LatitudeDegrees>40.7780135</LatitudeDegrees>\n
        \             <LongitudeDegrees>-73.9665795</LongitudeDegrees>\n            </Position>\n
        \           <AltitudeMeters>36.1867676</AltitudeMeters>\n            <DistanceMeters>0.0629519</DistanceMeters>\n
        \           <HeartRateBpm xsi:type=\"HeartRateInBeatsPerMinute_t\">\n              <Value>148</Value>\n
        \           </HeartRateBpm>\n          </Trackpoint>\n          <Trackpoint>\n
        \           <Time>2010-06-26T10:06:12Z</Time>\n            <Position>\n              <LatitudeDegrees>40.7780136</LatitudeDegrees>\n
        \             <LongitudeDegrees>-73.9665778</LongitudeDegrees>\n            </Position>\n
        \           <AltitudeMeters>35.2254639</AltitudeMeters>\n            <DistanceMeters>0.1698548</DistanceMeters>\n
        \           <HeartRateBpm xsi:type=\"HeartRateInBeatsPerMinute_t\">\n              <Value>148</Value>\n
        \           </HeartRateBpm>\n          </Trackpoint>\n        </Track>\n      </Lap>\n
        \   </Activity>\n  </Activities>\n```\n</details>  \n\n##### Derived Sport
        Activity Metrics\n\nBased on the attributes listed above, overall metrics
        like distance, duration, elevation gain / loss, as well as average and maximum
        speed are calculated.\n\n#### Sport Type\n\n<details>\n  <summary>Example</summary>\n\n<!--\ntitle:
        Example of an alpine skiing sport activity\nlineNumbers: true\n-->\n```xml\n<Activities>\n
        \ <Activity Sport=\"alpine_skiing\">\n  ...\n  </Activity>\n</Activities>\n```\n</details>
        \n\nThe name of the sport type is extracted from the `Sport` attribute in
        the `<Activities>` tag, \nwhich is nested inside a activities tag (`<Activities>`).\n\nYou
        can find a list of supported sport types down below.\n\n<details>\n  <summary>List
        of supported sport types</summary>\n\n  - aerobics\n - alpine_skiing\n - american_football\n
        - badminton\n - baseball\n - basketball\n - beach_volleyball\n - biathlon\n
        - biking\n - boating\n - body_transformation\n - bodyweight_training\n - bouldering\n
        - boxing\n - butt_training\n - calisthenics\n - cheerleading\n - cricket\n
        - cross_country_skiing\n - cross_skating\n - crossfit\n - curling\n - cycling\n
        - dancing\n - diving\n - driving\n - e_biking\n - e_sports\n - fencing\n -
        field_hockey\n - fishing\n - fitness_equipment\n - floor_climbing\n - flying\n
        - freecrossen\n - frisbee\n - generic\n - golf\n - gymnastics\n - handball\n
        - hang_gliding\n - hiking\n - horseback_riding\n - hunting\n - ice_hockey\n
        - ice_skating\n - ice_stock\n - inline_skating\n - jumping_rope\n - jumpmaster\n
        - kayaking\n - kite_skiing\n - kitesurfing\n - lacrosse\n - leg_training\n
        - martial_arts\n - meditation\n - motorcycling\n - mountaineering\n - multisport\n
        - nordicwalking\n - olympic_weightlifting\n - paddling\n - padel\n - plogging\n
        - pole_dancing\n - powerlifting\n - pullups\n - pushups\n - rafting\n - rock_climbing\n
        - rowing\n - rugby\n - running\n - sailing\n - scootering\n - situps\n - sixpack\n
        - skateboarding\n - skike\n - sky_diving\n - snowboarding\n - snowmobiling\n
        - snowshoeing\n - sledding\n - smovey_exercising\n - smovey_walking\n - snowball_fight\n
        - snowman_building\n - soccer\n - speed_skiing\n - squash\n - squats\n - stand_up_paddleboarding\n
        - stretching\n - surfing\n - suspension_training\n - swimming\n - tactical\n
        - tennis\n - tabata\n - table_tennis\n - track_field\n - training\n - trampoline\n
        - transition\n - via_ferrata\n - volleyball\n - wakeboarding\n - walking\n
        - water_skiing\n - wheelchair\n - windsurfing\n - zumba\n</details>\n\n<!--
        type: tab-end -->\n\n---"
      tags:
      - Activities
  "/v0/activities/{activity_id}":
