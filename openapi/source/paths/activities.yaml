        |\n| squash |  | squash |\n| squats |  | squats |\n| stand_up_paddleboarding
        |  | standup_paddling |\n| stair_climbing |  | stair_climbing |\n| standup_paddling
        |  | standup_paddling |\n| strength_training |  | strength_training |\n| stretching
