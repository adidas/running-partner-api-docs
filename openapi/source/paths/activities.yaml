      - Partner-in-behalf-of-User:
        - pa_identity
        - pa_activity_write
      requestBody:
        content:
          multipart/form-data:
            schema:
              "$ref": "../models/requests/body/activities.import.v0.yaml"
            examples: {}
        description: "You need to send a multipart request that consists of a file
          and the description text.\n\nAn example would look like this:\n```text\nPOST
          /v0/activities HTTP/1.1\nAuthorization: Bearer xxx\nAccept: */*\nHost: partnerapi.runtastic.com\nAccept-Encoding:
          gzip, deflate, br\nConnection: keep-alive\nContent-Type: multipart/form-data;
          boundary=--------------------------581243075298011649628917\nContent-Length:
          206326\n \n----------------------------581243075298011649628917\nContent-Disposition:
          form-data; name=\"file\"; filename=\"activity_12485610914.gpx\"\n<activity_12485610914.gpx>\n----------------------------581243075298011649628917\nContent-Disposition:
          form-data; name=\"description\"\nsome notes about my run\n----------------------------581243075298011649628917--\n``` "
      parameters:
      - "$ref": "#/components/parameters/Partner-in-behalf-of-user-Access-Token"
      description: "Create an activity based on a FIT/GPX/TCX file.\n\nIt expects
        to receive a multipart form with the attributes `file` and `description`.
        The activity will be associated to the authenticated user.\n\nThe request
        will NOT fail if the file content is invalid or truncated, since file validation
        and processing happens asynchronously.\n\n<!--\ntype: tab\ntitle: General
        validation rules\n-->\n\n- The `file` part must be a file upload, do not send
        xml as text\n- The filename of the uploaded file must end in either one of
        `.gpx`, `.tcx` or `.fit`\n- If the sport type is none of the ones we have
        defined, we will fallback to \"other\"\n\nSee the other two tabs to learn
        about how the FIT, GPX or TCX files themselves need to look like.\n\n<!--\ntype:
        tab\ntitle: FIT format info\n-->\n\n## FIT Format\n\nThe Flexible and Interoperable
        Data Transfer (FIT) protocol is a format designed specifically for the storing
        and sharing of data that originates from sport, fitness and health devices.
        It is specifically designed to be compact, interoperable and extensible.\n\nRunning App
        has the ability to process FIT Activity File (FIT_FILE_TYPE = 4) as defined
        in the official [FIT SDK](https://developer.garmin.com/fit/overview/).\n\nThe
        FIT protocol defines different messages and data fields, here is a list of
        fields grouped by message type that are used by Running App:\n\n**Supported
        session message attributes**\n```\n  timestamp\n  start_time\n  sport\n  sub_sport\n
        \ total_timer_time\n  total_elapsed_time\n  total_distance\n  total_calories\n
        \ total_ascent\n  total_descent\n  max_speed\n  enhanced_max_speed\n```\n\n**Supported
        record message attributes**\n```\n  timestamp\n  cadence\n  heart_rate\n  speed\n
        \ enhanced_speed\n  altitude\n  enhanced_altitude\n  position_lat\n  position_long\n
        \ distance\n  temperature  \n```\n\n**Supported event message attributes**\n```\n
        \ timestamp\n  event\n  event_type\n```\n\n**Sport type handling**\n\nRunning App
        supports the following value combinations for the `sport` and `sub_sport`
        values. You always need to provide a value for `sport` if you provide a value
        for `sub_sport`.\n\nIf you do not provide any `sport` value, Running App will
        assume a sport type of \"other\". If you provide values that don't match the
        ones in the following table, Running App treats it as if you did not provide
        a value. E.g. `sport=cycling` and `sub_sport=monocycle` (monocyle is not defined)
        would therefore be equivalent to providing `sport=cycling` and not providing
        `sub_sport`.\n\n| sport \t\t  | sub_sport  \t\t\t \t\t     | resulting Running App
        sport type\n|---|---|---|\n| aerobics |  | aerobics |\n| alpine_skiing |  |
        skiing |\n| alpine_skiing | backcountry | back_country_skiing |\n| alpine_skiing
        | resort | skiing |\n| american_football |  | american_football |\n| back_country_skiing
